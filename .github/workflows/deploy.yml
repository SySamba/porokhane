# Déploiement automatique du site sur l'hébergeur via FTP.
# À chaque push sur main : build React -> dist/ -> envoi des fichiers modifiés
# seulement (lftp mirror --only-newer). Fini de tout supprimer/re-uploader.
#
# Secrets à créer dans GitHub : Settings -> Secrets and variables -> Actions
#   FTP_HOST  (ex. ftp.digital-porokhane.com ou le serveur de l'hébergeur)
#   FTP_USER  (utilisateur FTP/cPanel)
#   FTP_PASS  (mot de passe)
#   FTP_DIR   (dossier racine du site, ex. /public_html ou /)
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build React -> dist/
        run: |
          npm ci
          npm run build

      - name: Vérification sécurité — aucun secret dans dist/
        run: |
          if find dist -name '*.json' -path './dist/*' -prune -o -name 'refined-vector*' -print -o -name 'email_config*' -print | grep .; then
            echo 'ERREUR: secret détecté dans dist/ — déploiement bloqué'; exit 1
          fi
          test ! -f dist/refined-vector-447411-b2-e3165d270c07.json
          test ! -f dist/scripts/email_config.json

      - name: Upload via SSH (rsync ou tar)
        run: |
          set -eo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
          export SSHPASS="$SSH_PASS"
          SSH="sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SSH_USER@$SSH_HOST"
          DIR="${FTP_DIR#/}"; [ -z "$DIR" ] && DIR="public_html"
          echo '--- Diagnostic : dossier de connexion ---'
          $SSH "pwd && ls && test -d $DIR && echo DIR-OK"
          if $SSH 'command -v rsync >/dev/null'; then
            echo '--- Déploiement rsync (incrémental + delete) ---'
            rsync -az --delete --itemize-changes \
              -e "sshpass -e ssh -p 65002 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
              --exclude '.well-known/' --exclude '.cpanel' --exclude 'cgi-bin' \
              dist/ "$SSH_USER@$SSH_HOST:$DIR/"
          else
            echo '--- Pas de rsync : nettoyage + upload tar ---'
            $SSH "cd $DIR && find . -mindepth 1 -maxdepth 1 ! -name '.well-known' -exec rm -rf {} +"
            tar -czf - -C dist . | $SSH "cd $DIR && tar -xzf -"
          fi
          echo '--- Vérification distante ---'
          $SSH "ls $DIR | head && test -f $DIR/index.html && echo DEPLOY-OK"
        env:
          SSH_HOST: ${{ secrets.FTP_HOST }}
          SSH_USER: ${{ secrets.FTP_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS || secrets.FTP_PASS }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
